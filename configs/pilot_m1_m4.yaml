# Aquí se define la configuración piloto para M1 (transfer learning con EfficientNetB4) y M4
# (CNN entrenada desde cero) sobre ISIC 2019. Es solo una especificación de diseño: todavía
# no se descargan datos ni se ejecutan entrenamientos.
status: proposed
seed: 42
framework: tensorflow

dataset:
  name: ISIC_2019
  split: training
  status: pending_execution
  classes:
    order: [AK, BCC, BKL, DF, MEL, NV, SCC, VASC]
    num_classes: 8
  input_shape: [380, 380, 3]
  expected_image_count: 25331
  expected_image_count_status: pending_verification
  partition:
    specification_status: proposed
    materialization_status: pending_execution
    materialized: false
    train: 0.70
    validation: 0.15
    test: 0.15
    stratified_by: class
    seed: 42
  ood_policy:
    reassign_unknown_to_known_classes: false

preprocessing:
  color_mode: rgb
  resize:
    height: 380
    width: 380
    interpolation: bilinear
  m1:
    dtype: float32
    expected_input_range: [0, 255]
    external_normalization: none
    preprocess_input:
      location: EfficientNetB4_internal
      apply_separately: false
    warning: "Do not divide by 255 or apply an additional external EfficientNet preprocess_input."
  m4:
    dtype: float32
    range: [0, 1]
    normalization: divide_by_255
  augmentation:
    specification_status: proposed
    execution_status: pending_execution
    applies_to: train_only
    order:
      - horizontal_flip
      - rotation
      - isotropic_zoom
      - contrast
    operations:
      horizontal_flip:
        probability: 0.5
      rotation:
        probability: 0.5
        degrees: [-30, 30]
        interpolation: bilinear
        fill_mode: reflect
      isotropic_zoom:
        probability: 0.5
        factor: [-0.10, 0.10]
        interpolation: bilinear
        fill_mode: reflect
      contrast:
        probability: 0.5
        factor: [0.90, 1.10]
        adjustment: per_channel_mean
    clip_range_after_augmentation: [0, 255]

common:
  batch_size: 8
  loss:
    name: categorical_crossentropy
    label_smoothing: 0.05
  optimizer_defaults:
    beta_1: 0.9
    beta_2: 0.999
    epsilon: 0.0000001
  callbacks:
    early_stopping:
      monitor: val_loss
      mode: min
      patience: 7
      min_delta: 0.0001
      restore_best_weights: true
    reduce_lr_on_plateau:
      monitor: val_loss
      mode: min
      factor: 0.2
      patience: 3
      min_lr: 0.0000001
      min_delta: 0.0001
      cooldown: 0
  class_weights:
    status: pending_execution
    formula: "w_c = N / (K * n_c)"
    computed_from: train_only

checkpoint_selection:
  status: proposed
  selection_set: validation
  monitor: val_loss
  mode: min
  criterion: strict_minimum
  exact_tie_policy: first_epoch_in_global_order
  evaluate_from: persisted_checkpoint_file
  test_set_used_for_selection: false
  m1:
    save_best_checkpoint_per_fase: true
    final_selection: minimum_val_loss_across_fase_1_and_fase_2
  m4:
    save_best_checkpoint: true

reproducibility:
  partition_seed: 42
  training_seeds:
    specification_status: proposed
    values: [42, 123, 456, 789, 2026]
  controls:
    python_random: true
    numpy: true
    tensorflow: true
  gpu_determinism:
    status: best_effort
    residual_nondeterminism_possible: true

m1:
  name: EfficientNetB4
  include_top: false
  weights: imagenet
  input_shape: [380, 380, 3]
  num_classes: 8
  head:
    - layer: GlobalAveragePooling2D
    - layer: BatchNormalization
    - layer: Dropout
      rate: 0.30
    - layer: Dense
      units: 256
      activation: relu
      kernel_initializer: he_normal
      kernel_regularizer:
        type: L2
        value: 0.0001
    - layer: Dropout
      rate: 0.30
    - layer: Dense
      units: 8
      activation: softmax
      dtype: float32
  training:
    status: pending_execution
    fase_1:
      backbone: frozen
      freeze_includes_backbone_batchnorm: true
      optimizer:
        name: Adam
        learning_rate: 0.001
      max_epochs: 15
    fase_2:
      backbone: partially_unfrozen
      exclude_backbone_batchnorm: true
      optimizer:
        name: Adam
        learning_rate: 0.00001
      max_epochs: 35
      # La profundidad de descongelado se elige empiricamente entre tres candidatos
      # declarados antes de correr (ver seleccion_descongelado). Los candidatos se alinean
      # a bloques; "ceil(0.30 * L)" cortaba a mitad del bloque 6a y equivalia al 77 %
      # de los parametros del backbone.
      candidates:
        block7_top:
          prefixes: ["block7", "top_"]
          backbone_trainable_params: 5253748
        block6_top:
          prefixes: ["block6", "block7", "top_"]
          backbone_trainable_params: 13836088
        block5_top:
          prefixes: ["block5", "block6", "block7", "top_"]
          backbone_trainable_params: 16119004
        # Ronda 2: declarada antes de ejecutar y despues de conocer la ronda 1, en la que
        # block5_top (el mas profundo) obtuvo el menor val_loss.
        block4_top:
          prefixes: ["block4", "block5", "block6", "block7", "top_"]
          backbone_trainable_params: 17162774
        block3_top:
          prefixes: ["block3", "block4", "block5", "block6", "block7", "top_"]
          backbone_trainable_params: 17355112
      seleccion_descongelado:
        status: executed
        selection_seed: 7
        uses_test: false
        start_from: fase_1_best_checkpoint_of_selection_seed
        criterion: minimum_val_loss
        tie_tolerance: 0.0001
        tie_break: fewer_trainable_params
        script: scripts/seleccionar_descongelado.py
        report: reports/seleccion_descongelado.json
        rondas:
          ronda_1:
            status: executed
            candidates: [block7_top, block6_top, block5_top]
            declared: antes_de_ejecutar
          ronda_2:
            status: pending_execution
            candidates: [block4_top, block3_top]
            declared: antes_de_ejecutar_y_despues_de_conocer_la_ronda_1
            reason: "en la ronda 1 gano el candidato mas profundo, es decir, el optimo quedo en el borde del rango; Tajbakhsh et al. (2016) proponen incluir mas capas hasta que el desempeno deje de mejorar"
            final_round: true
            final_round_reason: "block3_top es el limite practico: los bloques 1 y 2 son los mas generales (Yosinski et al., 2014) y descongelarlos equivale casi a ajustar todo el modelo con solo 17.705 imagenes de entrenamiento"
            selection: "se elige entre los cinco candidatos de ambas rondas por menor val_loss, con la misma tolerancia y el mismo desempate; si gana block3_top el optimo vuelve a quedar en el borde y se declara como limitacion, sin una tercera ronda"
        result_ronda_1:
          selected: block5_top
          commit: c8fae5d
          val_loss: { block7_top: 1.3027, block6_top: 1.2275, block5_top: 1.1986 }
          best_epoch: { block7_top: 17, block6_top: 17, block5_top: 21 }
          limitation: "block5_top es el candidato mas profundo probado; el val_loss siguio bajando con la profundidad, por lo que el optimo podria estar mas alla del rango declarado"

m4:
  name: CNN_from_scratch
  pretrained: false
  input_shape: [380, 380, 3]
  num_classes: 8
  blocks:
    - filters: 32
      kernel_size: [3, 3]
      strides: 1
      padding: same
      use_bias: false
      kernel_initializer: he_normal
      batch_normalization: true
      activation: relu
      pooling:
        type: MaxPooling2D
        pool_size: [2, 2]
        strides: 2
        padding: same
      dropout: 0.10
    - filters: 64
      kernel_size: [3, 3]
      strides: 1
      padding: same
      use_bias: false
      kernel_initializer: he_normal
      batch_normalization: true
      activation: relu
      pooling:
        type: MaxPooling2D
        pool_size: [2, 2]
        strides: 2
        padding: same
      dropout: 0.15
    - filters: 128
      kernel_size: [3, 3]
      strides: 1
      padding: same
      use_bias: false
      kernel_initializer: he_normal
      batch_normalization: true
      activation: relu
      pooling:
        type: MaxPooling2D
        pool_size: [2, 2]
        strides: 2
        padding: same
      dropout: 0.20
    - filters: 256
      kernel_size: [3, 3]
      strides: 1
      padding: same
      use_bias: false
      kernel_initializer: he_normal
      batch_normalization: true
      activation: relu
      pooling:
        type: MaxPooling2D
        pool_size: [2, 2]
        strides: 2
        padding: same
      dropout: 0.25
  head:
    - layer: GlobalAveragePooling2D
    - layer: Dense
      units: 256
      activation: relu
      kernel_initializer: he_normal
      kernel_regularizer:
        type: L2
        value: 0.0001
    - layer: Dropout
      rate: 0.30
    - layer: Dense
      units: 8
      activation: softmax
      dtype: float32
  training:
    status: pending_execution
    optimizer:
      name: Adam
      learning_rate: 0.001
    max_epochs: 50

evaluation:
  status: pending_execution
  metrics:
    - accuracy_global
    - precision_per_class
    - recall_per_class
    - f1_per_class
    - precision_macro
    - recall_macro
    - f1_macro
    - auc_macro_ovr
    - confusion_matrix
  mof:
    status: pending_execution
    formula: "MOF = w1*accuracy_global + w2*recall_macro + w3*auc_macro"
    sensitivity_scenarios:
      C0: { w1: 0.3333, w2: 0.3333, w3: 0.3334 }
      C1: { w1: 0.60, w2: 0.20, w3: 0.20 }
      C2: { w1: 0.20, w2: 0.60, w3: 0.20 }
      C3: { w1: 0.20, w2: 0.20, w3: 0.60 }
    ablation:
      status: pending_execution
      question: "la conclusion M1 vs M4 depende de alguna metrica en particular?"
      rule: "se quita una metrica a la vez y su peso se reparte proporcionalmente entre las restantes: w_j' = w_j / suma de los pesos que quedan"
      applied_to: ahp_principal_vector
      uses_test: false
      retrains_models: false
      reading: "se compara el signo y el orden de la diferencia MOF(M1) - MOF(M4) por semilla en cada variante"
      reference_weights_source: reports/ahp_report.json
      variants:
        sin_accuracy_global: { w1: 0.0000, w2: 0.7115, w3: 0.2885 }
        sin_recall_macro:    { w1: 0.2885, w2: 0.0000, w3: 0.7115 }
        sin_auc_macro:       { w1: 0.1412, w2: 0.8588, w3: 0.0000 }
  ahp:
    status: elicited_pending_review
    criteria_order:
      - accuracy_global
      - recall_macro
      - auc_macro
    elicited_by: "equipo autor (Jan Houter Hube, Camila Torres Vega), sin dermatólogo externo"
    elicited_date: "2026-09-26"
    pairwise_matrix:
      # a_ij: importancia del criterio i sobre el criterio j (escala de Saaty 1-9)
      accuracy_global: { accuracy_global: 1,       recall_macro: 0.2,     auc_macro: 0.3333 }
      recall_macro:    { accuracy_global: 5,       recall_macro: 1,       auc_macro: 3 }
      auc_macro:       { accuracy_global: 3,       recall_macro: 0.3333,  auc_macro: 1 }
    justification:
      recall_vs_accuracy: 5
      recall_vs_accuracy_reason: >
        Importancia fuerte. Garbe et al. (2026, Nature Communications, Registro Alemán
        Central de Melanoma Maligno, 9063 pacientes / 28 años): supervivencia específica
        por melanoma a 10 años de 85.0% con diagnóstico correcto vs. 62.1% con falso
        negativo, 8.2 años de vida perdidos en promedio por diagnóstico perdido.
        Krohling et al. (2021): en screening de cáncer de piel, recall se prioriza antes
        que accuracy y precision porque el falso negativo es el peor escenario clínico.
        Kurtansky et al. (2025, NPJ Digital Medicine): sistema real de triage de
        lesiones cutáneas sospechosas de cáncer, con métrica principal fijada en torno
        a un umbral mínimo de sensibilidad (80-90%); los autores señalan que los
        sistemas de apoyo diagnóstico oncológico deben minimizar los falsos negativos.
      auc_vs_accuracy: 3
      auc_vs_accuracy_reason: >
        Importancia moderada. AUC macro captura discriminación independiente del umbral,
        relevante para clases minoritarias, sin evidencia cuantitativa de daño tan directa
        como la de recall. Consistente con el diseño de evaluacion oficial de ISIC 2019
        (International Skin Imaging Collaboration, 2019): la accuracy balanceada
        (= recall promedio) es la metrica principal de ranking del desafio y el AUC
        es el criterio de desempate; la accuracy global sin balancear no se usa como
        criterio de clasificacion.
      recall_vs_auc: 3
      recall_vs_auc_reason: >
        Importancia moderada. Recall se liga directamente al daño clínico medido
        (años de vida perdidos por falso negativo); AUC es una medida más abstracta
        de capacidad de ranking. Tambien consistente con ISIC 2019: recall promedio
        es la metrica principal, AUC queda en un rol secundario de desempate.
    weights: { w1_accuracy_global: 0.1047, w2_recall_macro: 0.6370, w3_auc_macro: 0.2583 }
    consistency:
      method: Saaty
      n: 3
      lambda_max: 3.0385
      ci: 0.0193
      random_index: 0.58
      cr: 0.0332
      acceptance_rule: "CR <= 0.10"
      result: accepted
      script: scripts/compute_ahp.py
      report: reports/ahp_report.json
    limitation: >
      Elicitación realizada por el propio equipo autor, sin participación de un
      dermatólogo u otro experto clínico externo. Fundamentada en evidencia
      bibliográfica cuantitativa (Garbe et al. 2026; Krohling et al. 2021; Kurtansky
      et al. 2025), no en elicitación de un panel de expertos. Declarada como
      limitación metodológica explícita; sujeta a revisión en el marco de la
      supervisión del proyecto de título. El comité de supervisión tiene perfil de
      ingeniería, no clínico: esta limitación no se resuelve con su revisión, se
      mitiga con el análisis de sensibilidad C0-C3.
    requirement: >
      Revisión metodológica (no clínica) bajo la supervisión del proyecto de título:
      verificar que el procedimiento AHP esté bien aplicado (escala de Saaty,
      CR<=0.10) y que la evidencia citada (Garbe et al. 2026; Krohling et al. 2021;
      Kurtansky et al. 2025) respalde razonablemente los juicios. No se dispone de
      validación clínica experta; esa limitación se mitiga con el análisis de
      sensibilidad C0-C3, no con esta revisión. Completar antes de las corridas
      principales y de consultar prueba.
